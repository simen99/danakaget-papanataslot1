<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Papanatasslot - Dana Kaget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <base target="_top">

  <!-- Favicon & Preload Images -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/simen99/danakaget-papanataslot1/refs/heads/main/assets/049b1ca3-db9f-42b9-980d-7363faac5600.png">
  <link rel="preload" as="image" href="https://github.com/simen99/danakaget-papanataslot1/blob/main/assets/GARANSI.jpg?raw=true">
  <link rel="preload" as="image" href="https://raw.githubusercontent.com/simen99/danakaget-papanataslot1/refs/heads/main/assets/LUCKYANGPAO.jpg">
  <link rel="preload" as="image" href="https://raw.githubusercontent.com/simen99/danakaget-papanataslot1/refs/heads/main/assets/NEW.jpg">
  <link rel="preload" as="image" href="https://raw.githubusercontent.com/simen99/danakaget-papanataslot1/refs/heads/main/assets/HARIAN.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@400;600;700;800;900&family=Russo+One&display=swap" rel="stylesheet">

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* ==========================================================================
       1. VARIABLES & LUXURY BACKGROUND
       ========================================================================== */
    :root {
      --gold1: #ffd700;
      --gold2: #f5c013;
      --gold3: #b8860b;
      --content-width: 820px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 15%, #2a2007 0%, #111116 55%, #08080a 100%);
      color: #fff;
      text-align: center;
      padding: 24px 12px 60px;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }

    .main-container {
      max-width: var(--content-width);
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* ==========================================================================
       2. HEADER & BRANDING
       ========================================================================== */
    #pageTitle {
      font-family: 'Orbitron', sans-serif;
      color: #ffcc00;
      letter-spacing: 1px;
      margin: 0 0 16px;
      font-size: 34px;
      text-shadow: 0 0 18px rgba(255, 204, 0, 0.45);
    }

    #pageTitle .line1 .em { display: none; }
    #pageTitle .line1, #pageTitle .line2 { display: inline; }
    #pageTitle::before, #pageTitle::after {
      content: "🎁";
      display: inline;
      margin: 0 .25em;
      filter: drop-shadow(0 0 8px rgba(255,215,0,0.5));
    }
    #pageTitle .line1 { margin-right: .25em; }

    @media (max-width: 520px) {
      #pageTitle {
        font-size: clamp(26px, 8.5vw, 36px);
        line-height: 1.15;
      }
      #pageTitle .line1, #pageTitle .line2 { display: block; }
      #pageTitle::before, #pageTitle::after { content: none; }
      #pageTitle .line1 .em { display: inline; }
      #pageTitle .line1 { margin-right: 0; }
      #pageTitle .line2 { font-size: .9em; margin-top: 4px; }
    }

    /* ==========================================================================
       3. MARQUEE ANNOUNCEMENT BAR
       ========================================================================== */
    .marquee-box {
      display: flex;
      align-items: center;
      background: linear-gradient(165deg, #ffe27a 0%, #f1c232 40%, #d8a700 100%);
      padding: 9px 16px;
      border-radius: 12px;
      width: 100%;
      margin: 0 auto 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.45);
      border: 1px solid #b37b00;
    }

    .marquee-icon {
      font-size: 18px;
      font-weight: 800;
      margin-right: 10px;
      flex-shrink: 0;
      color: #1a1300;
    }

    .marquee-container {
      overflow: hidden;
      flex: 1;
    }

    .marquee-text {
      display: inline-block;
      white-space: nowrap;
      animation: marqueeAnim 16s linear infinite;
      font-weight: 800;
      font-size: 14px;
      color: #1a1300;
      letter-spacing: .3px;
    }

    @keyframes marqueeAnim {
      0%   { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* ==========================================================================
       4. PROMO SLIDER
       ========================================================================== */
    .pas-slider {
      position: relative;
      margin: 0 auto 16px;
      width: 100%;
      aspect-ratio: 16 / 4.2;
      border-radius: 16px;
      overflow: hidden;
      background: #0d0d0f;
      box-shadow: 0 12px 30px rgba(0,0,0,.5), 0 0 25px rgba(255,215,0,.2);
      border: 1px solid rgba(255,215,0,0.3);
    }

    @supports not (aspect-ratio: 16 / 4.2) {
      .pas-slider { height: 0; padding-top: 26.25%; }
      .pas-slider .slider-track { position: absolute; inset: 0; }
    }

    .pas-slider .slider-track {
      display: flex;
      height: 100%;
      transition: transform .65s cubic-bezier(.22,.8,.22,1);
      will-change: transform;
      backface-visibility: hidden;
    }

    .pas-slider::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 16px;
      padding: 3px;
      background: linear-gradient(160deg, #ffe27a 0%, #f1c232 45%, #b8860b 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: 1;
    }

    .pas-slider .slide { flex: 0 0 100%; height: 100%; }
    .pas-slider img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .pas-slider .slider-dots {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .pas-slider .slider-dots .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid #fff;
      background: rgba(0,0,0,.5);
      cursor: pointer;
      padding: 0;
      transition: transform .2s, background-color .2s;
    }

    .pas-slider .slider-dots .dot.active {
      background: #ffd700;
      border-color: #b8860b;
      box-shadow: 0 0 10px rgba(255,215,0,.9);
      transform: scale(1.25);
    }

    /* ==========================================================================
       5. GAME DASHBOARD / CONTROL PANEL
       ========================================================================== */
    .game-controls-panel {
      background: rgba(26, 22, 14, 0.65);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 18px;
      padding: 14px 18px;
      margin: 0 auto 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .controls-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      justify-content: center;
    }

    @media (min-width: 768px) {
      .controls-inner {
        flex-direction: row;
        gap: 12px;
      }
      .controls-inner .input-gold {
        flex: 1;
        max-width: 250px;
      }
      .controls-inner #playBtn {
        flex: 1;
        max-width: 220px;
        margin: 0 !important;
        white-space: nowrap;
      }
    }

    .input-gold {
      width: 100%;
      max-width: 320px;
      padding: 12px 14px 12px 46px;
      border-radius: 12px;
      border: 1px solid #b37b00;
      background:
        radial-gradient(120% 80% at 30% 0%, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 60%),
        linear-gradient(165deg, #ffe27a 0%, #f1c232 40%, #d8a700 100%);
      color: #1a1300;
      font-weight: 700;
      letter-spacing: .2px;
      outline: 0;
      transition: transform .18s ease, box-shadow .2s ease, border-color .2s ease;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 8px rgba(0,0,0,.15), 0 4px 12px rgba(0,0,0,.2);
      font-family: inherit;
    }

    .input-gold::placeholder {
      color: rgba(26,19,0,.8);
      text-transform: uppercase;
      letter-spacing: .5px;
      font-weight: 800;
      text-shadow: 0 1px 0 rgba(255,255,255,.3);
    }

    .input-gold:hover, .input-gold:focus {
      transform: translateY(-1px);
      border-color: #ffcf33;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 0 0 3px rgba(255,207,51,.3), 0 8px 18px rgba(255,215,0,.25);
    }

    #userId {
      background:
        url("data:image/svg+xml,%3Csvg width='22' height='22' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.418 0-8 2.239-8 5v1h16v-1c0-2.761-3.582-5-8-5Z' fill='%231a1300'/%3E%3C/svg%3E") no-repeat 14px 50% / 22px,
        radial-gradient(120% 80% at 30% 0%, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 60%),
        linear-gradient(165deg,#ffe27a 0%, #f1c232 40%, #d8a700 100%);
    }

    #kupon {
      background:
        url("data:image/svg+xml,%3Csvg width='22' height='22' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill='%231a1300' d='M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 1 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 1 0 0-4Zm6 1h2v8H9Zm4 0h2v8h-2Z'/%3E%3C/svg%3E") no-repeat 14px 50% / 22px,
        radial-gradient(120% 80% at 30% 0%, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 60%),
        linear-gradient(165deg,#ffe27a 0%, #f1c232 40%, #d8a700 100%);
    }

    .btn {
      position: relative;
      overflow: hidden;
      padding: 10px 18px;
      margin-bottom: 10px;
      border-radius: 12px;
      background: #ffcc00;
      color: #111;
      font-weight: 900;
      cursor: pointer;
      border: 2px solid #000 !important;
      transition: transform .15s, box-shadow .2s;
      animation: pulse 1.5s infinite;
      box-shadow: 0 4px 0 rgba(0,0,0,.25);
      font-family: inherit;
    }

    .btn:hover {
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 6px 0 rgba(0,0,0,.28), 0 0 14px rgba(255,215,0,.8);
    }

    .btn:disabled { opacity: .6; cursor: not-allowed; animation: none; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 4px 0 rgba(0,0,0,.25), 0 0 0 rgba(255,215,0,0); }
      50%      { box-shadow: 0 4px 0 rgba(0,0,0,.25), 0 0 14px rgba(255,215,0,.9); }
    }

    .btn .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      opacity: .6;
      pointer-events: none;
      background: #fff;
      animation: btnRipple .6s ease-out forwards;
    }
    @keyframes btnRipple { to { transform: scale(10); opacity: 0; } }

    .btn-like-login {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 320px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #b37b00 !important;
      background:
        radial-gradient(120% 80% at 30% 0%, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 60%),
        linear-gradient(165deg, #ffe27a 0%, #f1c232 40%, #d8a700 100%) !important;
      color: #1a1300 !important;
      text-decoration: none !important;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: .6px;
      text-shadow: 0 1px 0 rgba(255,255,255,.35);
      animation: none !important;
      cursor: pointer;
    }

    .btn-green {
      background: linear-gradient(165deg, #22c55e 0%, #16a34a 45%, #0f7a3b 100%) !important;
      color: #fff !important;
      border-color: #0b5e2e !important;
      box-shadow: 0 4px 0 rgba(0,0,0,.28), 0 0 14px rgba(34,197,94,.5) !important;
    }

    #playBtn.btn-green:disabled { opacity: 1 !important; cursor: default !important; }

    /* ==========================================================================
       6. GAME STAGE / ARENA (THE 6 BOXES)
       ========================================================================== */
    .game-arena {
      background: radial-gradient(circle at 50% 30%, rgba(35, 30, 15, 0.7) 0%, rgba(15, 15, 20, 0.85) 100%);
      border: 1.5px solid rgba(255, 215, 0, 0.28);
      border-radius: 22px;
      padding: 24px 20px 20px;
      margin: 0 auto 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 0 30px rgba(255, 215, 0, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .arena-header {
      font-size: 13px;
      font-weight: 800;
      color: #ffcf33;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .arena-header::before, .arena-header::after {
      content: "";
      height: 1px;
      width: 45px;
      background: linear-gradient(90deg, transparent, #ffcc00);
    }
    .arena-header::after {
      background: linear-gradient(90deg, #ffcc00, transparent);
    }

    .grid {
      display: grid;
      gap: 20px;
      justify-content: center;
      grid-template-columns: repeat(3, 1fr);
      max-width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 720px) {
      .grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 14px;
      }
      .game-arena {
        padding: 18px 12px 16px;
      }
    }

    .card {
      width: 100%;
      aspect-ratio: 1 / 1;
      perspective: 1000px;
      max-width: 220px;
      margin-inline: auto;
      cursor: pointer;
      border-radius: 18px;
      transition: box-shadow .25s ease, transform .2s ease;
      will-change: transform;
      contain: paint;
    }

    .card:hover {
      box-shadow: 0 0 16px rgba(255,215,0,0.95), 0 0 32px rgba(255,215,0,0.5);
      transform: translateY(-3px) scale(1.03);
    }

    .card.flipped:hover { box-shadow: none; transform: none; }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
      transition: transform 0.85s cubic-bezier(.22,.8,.22,1);
      will-change: transform;
      transform: translateZ(0);
    }

    .card.flipped .card-inner {
      -webkit-transform: rotateY(180deg);
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 0 1.5px rgba(255,215,0,0.6);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    .front {
      background-image: url('https://raw.githubusercontent.com/simen99/danakaget-papanataslot1/d87760746f92ccda0ab741f347d9730a4c94553b/assets/dana-kaget-spesial-weekend.jpg');
      background-size: cover;
      background-position: center;
      padding: 10px;
    }

    .back {
      -webkit-transform: rotateY(180deg);
      transform: rotateY(180deg);
      background: linear-gradient(160deg, var(--gold1) 0%, var(--gold2) 50%, var(--gold3) 100%);
      color: #111;
      display: flex;
      align-items: center !important;
      justify-content: center !important;
    }

    .grid .card .front .btn { display: none; margin-bottom: 6px; }

    .card.selected-box .back {
      background: linear-gradient(160deg, #00c853 0%, #00e676 50%, #1b5e20 100%) !important;
      color: #fff !important;
      box-shadow: 0 0 20px rgba(0,255,120,.85), 0 0 40px rgba(0,255,120,.45);
    }

    .card.zonk-box .back {
      background: linear-gradient(160deg, #ff3b30 0%, #ff6b6b 50%, #b00020 100%) !important;
      color: #fff !important;
      box-shadow: 0 0 20px rgba(255,59,48,.85);
    }

    .saldo-wrap { text-align: center; }
    .saldo-title { font-weight: 900; letter-spacing: .6px; margin-bottom: 4px; font-size: 14px; }
    .saldo-amount, .fake-amount, .zonk-label {
      font-family: 'Russo One', sans-serif;
      font-size: 20px;
    }
    .zonk-label { font-size: 24px; }

    @keyframes pasShake {
      0%, 100% { transform: translate3d(0,0,0) rotate(0deg); }
      5%  { transform: translate3d(1px,-1px,0) rotate(-0.4deg); }
      10% { transform: translate3d(-1px,1px,0) rotate(0.4deg); }
      15% { transform: translate3d(1px,0,0) rotate(-0.3deg); }
      20% { transform: translate3d(-1px,0,0) rotate(0.3deg); }
      25% { transform: translate3d(0,1px,0) rotate(-0.2deg); }
      30% { transform: translate3d(0,-1px,0) rotate(0.2deg); }
      60%, 99% { transform: translate3d(0,0,0) rotate(0deg); }
    }

    .card.shake {
      animation: pasShake 4.5s ease-in-out infinite;
      animation-delay: var(--shake-delay, 0s);
    }

    .card:hover, .card.flipped { animation: none !important; }

    .is-shuffling #grid { pointer-events: none; }
    .is-shuffling .card { animation: none !important; }

    .login-bottom-wrap {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .login-link {
      width: 100%;
      max-width: 340px;
      padding: 14px;
      font-size: 16px;
      letter-spacing: 1px;
    }

    /* ==========================================================================
       7. CONTACT DOCK (SIDEBAR DESKTOP)
       ========================================================================== */
    .contact-dock {
      position: fixed;
      left: 24px;
      bottom: 40px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(18, 18, 22, 0.6);
      padding: 10px;
      border-radius: 40px;
      border: 1px solid rgba(255, 215, 0, 0.25);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
    }

    .contact-btn {
      position: relative;
      display: block;
      width: 52px;
      height: 52px;
      transition: transform .2s ease;
    }

    .contact-btn img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(145deg, #ffd700, #b8860b);
      box-shadow: 0 0 8px rgba(255,215,0,0.5);
    }

    .contact-btn:hover { transform: scale(1.12); }

    .contact-btn::after {
      content: attr(data-label);
      position: absolute;
      left: 64px;
      top: 50%;
      transform: translateY(-50%) translateX(-8px);
      background: #111;
      color: #ffcc00;
      border: 1px solid #b37b00;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all .2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    @media (min-width: 768px) {
      .contact-btn:hover::after {
        opacity: 1;
        transform: translateY(-50%) translateX(0);
      }
    }

    @media (max-width: 720px) {
      .contact-dock {
        left: 14px;
        bottom: 20px;
        padding: 6px;
        gap: 10px;
      }
      .contact-btn { width: 44px; height: 44px; }
      .contact-btn::after { display: none; }
    }

    /* ==========================================================================
       8. PARTICLES & POPUPS
       ========================================================================== */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10000;
    }

    #pas-bokeh {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .bokeh-dot {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,215,0,.35), rgba(255,255,255,0) 70%);
      opacity: .12;
      animation: bokehFloat var(--bk-dur, 18s) linear infinite;
      filter: blur(1.5px);
    }

    @keyframes bokehFloat {
      0%   { transform: translateY(110vh) translateX(0) scale(var(--bk-scale,1)); }
      100% { transform: translateY(-20vh) translateX(var(--bk-dx, 40px)) scale(var(--bk-scale,1)); }
    }

    .sparkles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .sparkles .sp {
      position: absolute; width: 6px; height: 6px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,0) 60%), radial-gradient(circle at 70% 70%, #ffd700, rgba(255,215,0,0) 70%);
      box-shadow: 0 0 6px rgba(255,215,0,.7);
      animation: spTwinkle var(--sp-dur, 2.2s) ease-in-out infinite;
      opacity: 0;
    }
    @keyframes spTwinkle {
      0%, 100% { transform: scale(.6); opacity: 0; }
      50%      { transform: scale(1.2); opacity: 1; }
    }

    .pas-dust { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .pas-dust .d {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.55), rgba(255,215,0,.0) 65%);
      opacity: .10; filter: blur(0.5px);
      animation: pasDust 10s linear infinite;
    }
    @keyframes pasDust {
      0%   { transform: translateY(20%); opacity: 0; }
      10%, 80% { opacity: .12; }
      100% { transform: translateY(-120%); opacity: 0; }
    }

    .fx-glowwave {
      position: absolute; inset: 0; border-radius: 18px; pointer-events: none;
      background: conic-gradient(from var(--angle, 0deg), rgba(255,215,0,0.35), rgba(255,255,255,0.08), rgba(255,215,0,0.35));
      mix-blend-mode: screen; animation: fxGlowWaveSpin 8s linear infinite; opacity: 0.5;
    }
    @keyframes fxGlowWaveSpin { to { --angle: 360deg; } }

    .card.flipped .sparkles, .card.flipped .pas-dust, .card.flipped .fx-glowwave { display: none; }

    .nx-flash {
      position: absolute; inset: 0; pointer-events: none; border-radius: 18px;
      background: radial-gradient(60% 60% at 50% 50%, rgba(255,255,255,.85), rgba(255,215,0,.65) 35%, transparent 70%);
      mix-blend-mode: screen; filter: blur(2px);
      animation: nxFlash .42s ease-out forwards;
    }
    @keyframes nxFlash { from { opacity: 0; } 50% { opacity: 1; } to { opacity: 0; } }

    #nx-comets { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .nx-comet {
      position: absolute; width: 10px; height: 10px; border-radius: 50%;
      background: radial-gradient(circle, #fff, rgba(255,255,255,0) 65%), radial-gradient(circle, #ffd700, rgba(255,215,0,0) 75%);
      box-shadow: 0 0 18px rgba(255,215,0,.7);
      opacity: .95; transform: translate(-50%, -50%);
    }
    .nx-comet::after {
      content: ""; position: absolute; right: 50%; top: 50%; height: 2px; width: 140px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, rgba(255,215,0,0), rgba(255,215,0,.7));
      filter: blur(1px);
    }
    @keyframes nxCometFly { to { transform: translate(-50%,-50%) translate(var(--dx), var(--dy)); opacity: 0; } }

    #nx-trails { position: fixed; inset: 0; pointer-events: none; z-index: 8; }
    .nx-trail { position: absolute; border-radius: 18px; overflow: hidden; will-change: transform, opacity; }
    .nx-trail::before {
      content: ""; position: absolute; inset: 0; border-radius: 18px;
      background: radial-gradient(60% 60% at 50% 50%, rgba(255,255,255,.25), transparent 65%), linear-gradient(120deg, rgba(255,215,0,.40), rgba(255,215,0,.05));
      mix-blend-mode: screen; filter: blur(2px); opacity: .85;

    /* Prize Popup */
    #popup {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,.85); z-index: 10050; backdrop-filter: blur(6px);

    #popup .popup-box {

      background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);

    .pas-popup { font-family: 'Poppins', sans-serif; text-align: center; }

    .alert-box {
      position: relative; width: min(92vw, 420px); padding: 24px 20px 18px; border-radius: 18px;
      background: rgba(22, 22, 26, 0.92); border: 1px solid rgba(255,255,255,.1);

    .alert-close {

    .alert-overlay[data-type="success"] { --accent: #16a34a; }

    .alert-overlay[data-type="info"]    { --accent: #3b82f6; }
  </style>

    <div class="alert-box" role="document">
      <button class="alert-close" aria-label="Tutup" onclick="hideAlert()">✖</button>
      <div class="alert-icon" id="alertIcon">⚠️</div>
      <div class="alert-title" id="alertTitle">Pemberitahuan</div>
      <div class="alert-msg" id="alertMsg">Pesan di sini…</div>
      <div class="alert-actions">
        <button class="btn-alert" onclick="hideAlert()">Oke</button>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       JAVASCRIPT LOGIC
       ========================================================================== -->
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzo9sJxgcmxHmlQGy2w8kSo8ojkUIJvF_mx92ykQKAxNZxsT0SYqZnb1AoYS9A-3zCGxQ/exec";
    const PREVIEW_POOL = [4000, 6000, 10000, 50000, 100000, 250000];
    const SHUFFLE_PATTERNS = [
      [6,1,5,3,2,4],
      [2,3,1,6,4,5],
      [4,2,6,1,5,3],
      [3,6,2,5,1,4],
      [5,1,3,2,6,4]
    ];

    let locked = false;
    let canPick = false;
    let isShuffling = false;
    let cool = false;

    const delay = ms => new Promise(r => setTimeout(r, ms));
    const toNum = s => parseInt(String(s).replace(/[^0-9]/g, ''), 10) || 0;

    function haptic(ms = 8) {
      try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e) {}
    }

    function coolDown(ms = 1200) {
      cool = true;
      setTimeout(() => cool = false, ms);
    }

    function setEnabled(enabled) {
      document.querySelectorAll('.btn').forEach(b => {
        b.disabled = !enabled;
      });
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function displayKey(v) {
      if (v === 100000) return 'ZONK';
      if (v === 250000) return '25000';
      if (v === 50000)  return '2000';
      return String(v);
    }

    async function api(action, data) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort('timeout'), 12000);

      const r = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        cache: 'no-store',
        body: JSON.stringify({ action, ...data }),
        signal: ctrl.signal
      }).catch(err => {
        throw new Error(err.name === 'AbortError' ? 'Waktu koneksi habis.' : 'Tidak bisa menghubungi server.');
      });

      clearTimeout(t);
      const text = await r.text();
      let res;
      try { res = JSON.parse(text); }
      catch { throw new Error('Balasan bukan JSON: ' + text.slice(0, 120)); }

      if (!r.ok) throw new Error('HTTP ' + r.status + ' — ' + (res.message || ''));
      return res;
    }

    async function validateKuponServer(userId, kupon) {
      try {
        const res = await api('cekKupon', { userId, kupon });
        const used = !!res.used;
        const allow = !!res.allow;
        return { ok: (allow && !used), used, res, message: res.message || '' };
      } catch (err) {
        // Fallback: Jika backend belum ada action cekKupon, tetap izinkan main
        return { ok: true, used: false, message: '' };
      }
    }

    function showAlert(message, { type = 'warning', title = 'Pemberitahuan', autoclose = 0 } = {}) {
      const el = document.getElementById('alertModal');
      const iconMap = { success: '✅', warning: '⚠️', error: '⛔', info: 'ℹ️' };

      el.dataset.type = type;
      document.getElementById('alertIcon').textContent = iconMap[type] || '⚠️';
      document.getElementById('alertTitle').textContent = title;
      document.getElementById('alertMsg').textContent = message;

      el.style.display = 'flex';
      void el.offsetWidth;
      el.classList.add('show');

      const esc = (e) => { if (e.key === 'Escape') hideAlert(); };
      el._esc = esc;
      document.addEventListener('keydown', esc);

      if (autoclose > 0) {
        clearTimeout(el._t);
        el._t = setTimeout(hideAlert, autoclose);
      }
    }

    function hideAlert() {
      const el = document.getElementById('alertModal');
      el.classList.remove('show');
      setTimeout(() => { el.style.display = 'none'; }, 250);
      if (el._esc) {
        document.removeEventListener('keydown', el._esc);
        el._esc = null;
      }
    }

    function showPromo() { document.getElementById('promoPopup').style.display = 'flex'; }
    function hidePromo() { document.getElementById('promoPopup').style.display = 'none'; }

    function waitEnd(inner) {
      return new Promise(resolve => {
        const onEnd = (e) => {
          if (e.propertyName === 'transform') {
            inner.removeEventListener('transitionend', onEnd);
            resolve();
          }
        };
        inner.addEventListener('transitionend', onEnd);
      });
    }

    async function flipCascade(list, open = true, step = 160) {
      for (const card of list) {
        const inner = card.querySelector('.card-inner');
        if (open) card.classList.add('flipped'); else card.classList.remove('flipped');
        await Promise.race([waitEnd(inner), delay(step)]);
      }
      const lastInner = list[list.length - 1]?.querySelector('.card-inner');
      if (lastInner) await waitEnd(lastInner);
    }

    async function showPreview(showMs = 2400) {
      const cards = [...document.querySelectorAll('.card')];
      document.querySelectorAll('.front .btn').forEach(b => b.style.display = 'none');

      const preview = shuffle([...PREVIEW_POOL]);
      cards.forEach((c, i) => {
        const v = preview[i % preview.length];
        const back = c.querySelector('.back');
        const isZonk = (v === 100000);
        let shownV = v;
        if (v === 250000) shownV = 25000;
        else if (v === 50000) shownV = 2000;

        c.classList.toggle('zonk-box', isZonk);
        back.innerHTML = isZonk
          ? `<div class="zonk-label">ZONK !</div>`
          : `<div class="fake-amount">Rp ${shownV.toLocaleString('id-ID')}</div>`;
      });

      await flipCascade(cards, true, 160);
      await delay(showMs);
      await flipCascade(cards.slice().reverse(), false, 160);

      cards.forEach(c => {
        c.classList.remove('zonk-box', 'selected-box');
        c.querySelector('.back').innerHTML = '';
      });

      await delay(140);
    }

    async function flipReorder(order, opts = {}) {
      const { duration = 900, easing = 'cubic-bezier(.22,.8,.22,1)' } = opts;
      const grid  = document.getElementById('grid');
      const cards = Array.from(grid.children);
      const first = cards.map(el => el.getBoundingClientRect());

      const newOrder = order.map(i => cards[i-1]);
      newOrder.forEach(el => grid.appendChild(el));

      const last = newOrder.map(el => el.getBoundingClientRect());

      newOrder.forEach((el, i) => {
        const oldIndex = cards.indexOf(el);
        const dx = first[oldIndex].left - last[i].left;
        const dy = first[oldIndex].top  - last[i].top;
        const rot = (Math.random() * 0.6 - 0.3).toFixed(2);

        el.style.transition = 'transform 0s';
        el.style.transform  = `translate3d(${dx}px, ${dy}px, 0) rotate(${rot}deg)`;
      });

      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

      newOrder.forEach((el) => {
        el.style.transition = `transform ${duration}ms ${easing}`;
        el.style.transform  = 'translate3d(0,0,0) rotate(0deg)';
      });

      await delay(duration + 40);
    }

    async function runShuffle() {
      if (isShuffling) return;
      isShuffling = true;
      document.body.classList.add('is-shuffling');

      const seq = [];
      const pool = [...SHUFFLE_PATTERNS];
      for (let i = 0; i < 5; i++) {
        const pick = Math.floor(Math.random() * pool.length);
        seq.push(pool[pick]);
        pool.push(pool.splice(pick, 1)[0]);
      }

      try {
        for (const pat of seq) {
          await flipReorder(pat, { duration: 1100, easing: 'cubic-bezier(.22,.8,.22,1)' });
          await delay(220);
        }
      } finally {
        document.body.classList.remove('is-shuffling');
        isShuffling = false;
      }
    }

    function reindexPickButtons() {
      document.querySelectorAll('#grid .card').forEach((card, i) => {
        const btn = card.querySelector('.front .btn');
        if (btn) btn.setAttribute('onclick', `claim(${i + 1})`);
      });
    }

    async function startGame() {
      if (locked || isShuffling) return;
      if (canPick) {
        showAlert('Box sudah diacak. Silakan pilih salah satu.', { type: 'info', title: 'Sudah diacak' });
        return;
      }

      const btn    = document.getElementById('playBtn');
      const userId = document.getElementById('userId').value.trim();
      const kupon  = document.getElementById('kupon').value.trim();

      if (!userId || !kupon) {
        showAlert('Masukkan USER ID dan KUPON terlebih dahulu!', { type: 'warning', title: 'Data belum lengkap' });
        return;
      }

      setEnabled(false);
      btn.textContent = 'Mengecek…';

      const check = await validateKuponServer(userId, kupon);
      if (!check.ok) {
        const type  = check.used ? 'info' : 'error';
        const title = check.used ? 'Kupon sudah digunakan' : 'Validasi gagal';
        const msg   = check.message || (check.used
          ? 'Kupon ini sudah pernah dipakai untuk klaim.'
          : 'Kupon tidak valid / gagal diverifikasi.');

        showAlert(msg, { type, title });
        btn.textContent = 'MULAI BERMAIN';
        setEnabled(true);
        return;
      }

      btn.textContent = 'MENAMPILKAN HADIAH…';
      document.querySelectorAll('.front .btn').forEach(b => b.style.display = 'none');

      await showPreview(2000);

      btn.textContent = 'MENGACAK…';
      haptic(18);
      await runShuffle();
      reindexPickButtons();

      canPick = true;
      btn.textContent = 'SILAHKAN PILIH BOX';
      btn.classList.add('btn-green');
      document.querySelectorAll('.front .btn').forEach(b => b.style.display = 'inline-block');
      setEnabled(true);
      btn.disabled = true;
      btn.title = 'Box sudah diacak. Pilih salah satu.';
    }

    async function baseClaim(idx) {
      if (locked) return;

      const btn = document.querySelector(`.grid .card:nth-child(${idx}) .front .btn`);
      const restore = () => { if (btn) btn.textContent = 'PILIH BOX'; };

      try { hidePromo(); } catch(e) {}

      const userId = document.getElementById('userId').value.trim();
      const kupon  = document.getElementById('kupon').value.trim();
      if (!userId || !kupon) {
        showAlert('Masukkan USER ID dan KUPON terlebih dahulu!', { type: 'warning', title: 'Data belum lengkap' });
        return;
      }

      if (btn) btn.textContent = 'Mengecek...';
      setEnabled(false);

      try {
        const res = await api('pilihBox', { userId, kupon, idx });
        if (res.status !== 'success') {
          showAlert(res.message || 'Terjadi kesalahan.', { type: 'error', title: 'Gagal' });
          return;
        }

        document.querySelectorAll('.card').forEach((c, i) => {
          if (i !== (idx - 1)) {
            const b = c.querySelector('.front .btn');
            if (b) { b.classList.add('btn-hide'); b.style.display = 'none'; }
          }
        });

        const cards = document.querySelectorAll('.card');
        cards.forEach((c, i) => setTimeout(() => c.classList.add('flipped'), i * 180));

        const pool = [4000, 6000, 10000, 50000, 100000, 250000];
        const hadiahAsli = toNum(res.hadiah);
        const hadiahKey  = displayKey(hadiahAsli);
        const others     = shuffle(pool.filter(v => displayKey(v) !== hadiahKey));

        const displayAmounts = Array(6);
        displayAmounts[idx - 1] = hadiahAsli;
        let k = 0;
        for (let i = 0; i < 6; i++) {
          if (i !== idx - 1) displayAmounts[i] = others[k++];
        }

        setTimeout(() => {
          cards.forEach((c, i) => {
            const back = c.querySelector('.back');
            const v = displayAmounts[i];
            const isZonk = (v === 100000);
            let shownV = v;
            if (v === 250000) shownV = 25000;
            else if (v === 50000) shownV = 2000;
            const labelRp = `Rp ${shownV.toLocaleString('id-ID')}`;

            if (isZonk) {
              c.classList.add('zonk-box');
              back.innerHTML = `<div class="zonk-label">ZONK !</div>`;
            } else if (i === (idx - 1)) {
              c.classList.add('selected-box');
              back.innerHTML = `
                <div class="saldo-wrap">
                  <div class="saldo-title">SALDO AKUN</div>
                  <div class="saldo-amount">${labelRp}</div>
                </div>`;
            } else {
              back.innerHTML = `<div class="fake-amount">${labelRp}</div>`;
            }
          });
        }, 260);

        setTimeout(() => {
          document.getElementById('popup-content').innerHTML = `
            <button class="popup-x" aria-label="Tutup" onclick="closePrizePopup()">✖</button>
            <div class="pas-popup">
              <img class="pas-brand" src="https://raw.githubusercontent.com/simen99/danakaget-papanataslot1/e02f8a4f84748a98fbfc25bccb2fb8a207d38073/assets/papanatasslot-logo%20(1).png" alt="Papan Atas Slot">
              <div class="pas-subtitle">Anda mendapatkan</div>
              <div class="pas-amount">IDR ${hadiahAsli.toLocaleString('id-ID')}</div>
              <div class="pas-meta">Coupon Code : <b>${res.kupon}</b></div>
              <div class="pas-meta">Username : <b>${(res.username || res.userId || '-')}</b></div>
              <div class="pas-hint">SCREENSHOT DAN KLAIM HADIAH MELALUI WHATSAPP ATAU TELEGRAM</div>
              <div class="pas-btn-row">
                <a href="https://klikblg.com/wa-pas" target="_blank" rel="noopener" class="pas-btn pas-wa">KLAIM WA</a>
                <a href="https://klikblg.com/tele-pas" target="_blank" rel="noopener" class="pas-btn pas-tg">KLAIM TELE</a>
              </div>
              <button type="button" class="pas-btn pas-reset" onclick="closePrizePopup()">
                PILIH BOX LAGI
              </button>
            </div>`;
          document.getElementById('popup').style.display = 'flex';

          requestAnimationFrame(() => {
            const myCanvas = document.getElementById('confetti-canvas');
            const myConfetti = confetti.create(myCanvas, { resize: true, useWorker: true });
            myConfetti({ particleCount: 160, spread: 70, origin: { y: 0.6 } });
          });

          locked = true;
        }, cards.length * 120 + 360 + 3000);

      } catch (err) {
        console.error(err);
        showAlert('Gagal menghubungi server. Coba lagi.', { type: 'error', title: 'Jaringan bermasalah' });
      } finally {
        restore();
        setEnabled(true);
      }
    }

    window.claim = async function(idx) {
      if (!canPick) {
        showAlert('Klik tombol "MULAI BERMAIN" dulu untuk mengacak box.', { type: 'info', title: 'Belum mulai' });
        return;
      }
      if (cool) return;
      coolDown();
      await baseClaim(idx);
    };

    /* ==========================================================================
       FUNGSI RESET TOTAL KE TAMPILAN AWAL (DEFAULT)
       ========================================================================== */
    function resetBoxes() {
      const cards = document.querySelectorAll('.card');

      // 1. Putar balik semua kartu ke sisi depan & hapus tema box
      cards.forEach(card => {
        card.classList.remove('flipped', 'selected-box', 'zonk-box');
        const back = card.querySelector('.back');
        if (back) back.innerHTML = '';

        const btn = card.querySelector('.front .btn');
        if (btn) {
          btn.classList.remove('btn-hide');
          btn.style.display = 'none'; // sembunyikan kembali tombol "PILIH BOX" seperti semula
          btn.textContent = 'PILIH BOX';
        }
      });

      // 2. Tutup modal popup hadiah
      const pop = document.getElementById('popup');
      if (pop) pop.style.display = 'none';

      // 3. Reset status permainan (State Variables)
      locked = false;
      canPick = false;
      isShuffling = false;
      cool = false;

      // 4. Pulihkan tombol MULAI BERMAIN (Warna Kuning & Aktif)
      const pb = document.getElementById('playBtn');
      if (pb) {
        pb.disabled = false;
        pb.textContent = 'MULAI BERMAIN';
        pb.title = '';
        pb.classList.remove('btn-green');
      }

      // 5. Kosongkan input Kupon karena sudah terpakai
      const kuponInput = document.getElementById('kupon');
      if (kuponInput) kuponInput.value = '';

      // Biarkan User ID tetap terisi agar tidak perlu input berulang kali
    }

    // Fungsi khusus tutup popup sekaligus reset
    function closePrizePopup() {
      resetBoxes();
    }

    function initSlider() {
      const slider = document.getElementById('promoSlider');
      if (!slider) return;

      const track = slider.querySelector('.slider-track');
      const originalSlides = Array.from(track.children);

      const firstClone = originalSlides[0].cloneNode(true);
      const lastClone  = originalSlides[originalSlides.length - 1].cloneNode(true);
      track.insertBefore(lastClone, originalSlides[0]);
      track.appendChild(firstClone);

      let index = 1;
      const DURATION = 3000;
      let timer = null;

      const dotsWrap = document.getElementById('sliderDots');
      const dots = originalSlides.map((_, i) => {
        const d = document.createElement('button');
        d.className = 'dot';
        d.type = 'button';
        d.setAttribute('aria-label', 'Slide ' + (i + 1));
        d.addEventListener('click', () => { index = i + 1; move(); restart(); });
        dotsWrap.appendChild(d);
        return d;
      });

      function updateDots() {
        const active = (index - 1 + originalSlides.length) % originalSlides.length;
        dots.forEach((d, i) => d.classList.toggle('active', i === active));
      }

      function setTransform() {
        track.style.transform = `translate3d(-${index * 100}%,0,0)`;
      }

      function move() {
        requestAnimationFrame(setTransform);
        updateDots();
      }

      requestAnimationFrame(setTransform);
      updateDots();

      function next() { index += 1; move(); }
      function start() { stop(); timer = setInterval(next, DURATION); }
      function stop() { if (timer) { clearInterval(timer); timer = null; } }
      function restart() { start(); }

      track.addEventListener('transitionend', () => {
        const total = originalSlides.length;
        if (index === total + 1) {
          track.style.transition = 'none';
          index = 1; setTransform();
          void track.offsetWidth; track.style.transition = '';
        } else if (index === 0) {
          track.style.transition = 'none';
          index = total; setTransform();
          void track.offsetWidth; track.style.transition = '';
        }
      });

      slider.addEventListener('mouseenter', stop);
      slider.addEventListener('mouseleave', start);

      let startX = 0, deltaX = 0, dragging = false;
      const onStart = x => { dragging = true; startX = x; stop(); track.style.transition = 'none'; };
      const onMove  = x => {
        if (!dragging) return;
        deltaX = x - startX;
        track.style.transform = `translate3d(calc(-${index * 100}% + ${deltaX}px), 0, 0)`;
      };
      const onEnd = () => {
        if (!dragging) return;
        dragging = false;
        track.style.transition = '';
        const threshold = slider.clientWidth / 6;
        if (Math.abs(deltaX) > threshold) index += (deltaX < 0 ? 1 : -1);
        deltaX = 0;
        move();
        start();
      };

      if ('onpointerdown' in window) {
        slider.addEventListener('pointerdown', e => onStart(e.clientX));
        slider.addEventListener('pointermove', e => onMove(e.clientX));
        slider.addEventListener('pointerup', onEnd);
        slider.addEventListener('pointercancel', onEnd);
      } else {
        slider.addEventListener('touchstart', e => onStart(e.touches[0].clientX), { passive: true });
        slider.addEventListener('touchmove',  e => onMove(e.touches[0].clientX),  { passive: true });
        slider.addEventListener('touchend', onEnd);
      }

      start();
    }

    document.addEventListener('DOMContentLoaded', () => {
      showPromo();

      // Tutup modal promo dengan ESC
      document.addEventListener('keydown', e => {
        const el = document.getElementById('promoPopup');
        if (e.key === 'Escape' && el.style.display === 'flex') hidePromo();
      });

      // Tutup modal hadiah dengan ESC dan reset permainan
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          const pop = document.getElementById('popup');
          if (pop && pop.style.display === 'flex') {
            closePrizePopup();
          }
        }
      });

      // Tutup modal hadiah saat klik di latar belakang gelap luar popup
      const popEl = document.getElementById('popup');
      if (popEl) {
        popEl.addEventListener('click', function(e) {
          if (e.target === this) {
            closePrizePopup();
          }
        });
      }

      document.querySelectorAll('.card').forEach((c, i) => {
        c.classList.add('shake');
        c.style.setProperty('--shake-delay', (i * 0.3) + 's');
      });

      document.querySelectorAll('.btn').forEach(btn => {
        btn.addEventListener('click', e => {
          haptic(10);
          const d = Math.max(btn.clientWidth, btn.clientHeight);
          const ripple = document.createElement('span');
          ripple.className = 'ripple';
          ripple.style.width = ripple.style.height = d + 'px';
          const rect = btn.getBoundingClientRect();
          ripple.style.left = (e.clientX - rect.left - d / 2) + 'px';
          ripple.style.top  = (e.clientY - rect.top  - d / 2) + 'px';
          btn.appendChild(ripple);
          setTimeout(() => ripple.remove(), 650);
        });
      });

      document.querySelectorAll('.card .face.front').forEach(face => {
        const wrap = document.createElement('div');
        wrap.className = 'sparkles';
        for (let i = 0; i < 5; i++) {
          const sp = document.createElement('span');
          sp.className = 'sp';
          sp.style.left = (Math.random() * 88 + 6) + '%';
          sp.style.top  = (Math.random() * 78 + 8) + '%';
          sp.style.setProperty('--sp-dur', (1.8 + Math.random() * 1.8).toFixed(2) + 's');
          const s = (Math.random() * 5 + 3).toFixed(0);
          sp.style.width = sp.style.height = s + 'px';
          wrap.appendChild(sp);
        }
        face.appendChild(wrap);
      });

      const bg = document.getElementById('pas-bokeh');
      for (let i = 0; i < 16; i++) {
        const d = document.createElement('div');
        d.className = 'bokeh-dot';
        const size = Math.random() * 80 + 30;
        d.style.width = d.style.height = size + 'px';
        d.style.left = (Math.random() * 100) + 'vw';
        d.style.setProperty('--bk-scale', (Math.random() * 0.5 + 0.7).toFixed(2));
        d.style.setProperty('--bk-dur', (14 + Math.random() * 16).toFixed(1) + 's');
        d.style.setProperty('--bk-dx', (Math.random() * 160 - 80).toFixed(0) + 'px');
        d.style.animationDelay = (-Math.random() * 20).toFixed(2) + 's';
        bg.appendChild(d);
      }

      document.querySelectorAll('.card .face.front').forEach(face => {
        const w = document.createElement('div');
        w.className = 'pas-dust';
        for (let i = 0; i < 6; i++) {
          const dot = document.createElement('span');
          dot.className = 'd';
          const size = (Math.random() * 5 + 3).toFixed(0);
          dot.style.width = dot.style.height = size + 'px';
          dot.style.left = (Math.random() * 92) + '%';
          dot.style.top  = (Math.random() * 100) + '%';
          dot.style.animationDuration = (9 + Math.random() * 6).toFixed(1) + 's';
          w.appendChild(dot);
        }
        face.appendChild(w);
      });

      document.querySelectorAll('.card .front').forEach(front => {
        const glow = document.createElement('div');
        glow.className = 'fx-glowwave';
        front.appendChild(glow);
      });

      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const host = document.createElement('div');
        host.id = 'nx-comets';
        document.body.appendChild(host);
        setInterval(() => {
          const s = document.createElement('span');
          s.className = 'nx-comet';
          const x = Math.random() * window.innerWidth * 0.8 + window.innerWidth * 0.1;
          const y = Math.random() * window.innerHeight * 0.2 + window.innerHeight * 0.1;
          s.style.left = x + 'px';
          s.style.top = y + 'px';
          const dx = (-window.innerWidth * 0.5) + 'px';
          const dy = (window.innerHeight * (Math.random() * 0.6 + 0.2)) + 'px';
          s.style.setProperty('--dx', dx);
          s.style.setProperty('--dy', dy);
          s.style.animation = `nxCometFly 2200ms ease-out forwards`;
          host.appendChild(s);
          setTimeout(() => s.remove(), 2400);
        }, 4500);
      }

      initSlider();
    });

    (() => {
      const grid = document.getElementById('grid');
      if (!grid) return;
      const seen = new WeakSet();
      const obs = new MutationObserver(muts => {
        muts.forEach(m => {
          if (m.target && m.target.classList && m.target.classList.contains('card') && m.attributeName === 'class') {
            const card = m.target;
            if (card.classList.contains('flipped') && !seen.has(card)) {
              seen.add(card);
              const back = card.querySelector('.back');
              if (back) {
                const fx = document.createElement('span');
                fx.className = 'nx-flash';
                back.appendChild(fx);
                setTimeout(() => fx.remove(), 450);
              }
            }
          }
        });
      });
      obs.observe(grid, { attributes: true, subtree: true, attributeFilter: ['class'] });
    })();
  </script>
